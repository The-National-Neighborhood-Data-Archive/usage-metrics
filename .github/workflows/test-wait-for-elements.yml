name: Test Wait For Elements

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install selenium beautifulsoup4
    
    - name: Install Chrome
      uses: browser-actions/setup-chrome@latest
    
    - name: Install ChromeDriver
      uses: nanasess/setup-chromedriver@v2
    
    - name: Create test script
      run: |
        cat > test_wait.py << 'EOF'
        from selenium import webdriver
        from selenium.webdriver.chrome.options import Options
        from selenium.webdriver.common.by import By
        from selenium.webdriver.support.ui import WebDriverWait
        from selenium.webdriver.support import expected_conditions as EC
        from bs4 import BeautifulSoup
        import time
        import re

        def extract_number(text):
            if not text:
                return 'NA'
            cleaned = re.sub(r'[^0-9]', '', text)
            return cleaned if cleaned else 'NA'

        chrome_options = Options()
        chrome_options.add_argument('--headless')
        chrome_options.add_argument('--no-sandbox')
        chrome_options.add_argument('--disable-dev-shm-usage')
        chrome_options.add_argument('--disable-gpu')

        driver = webdriver.Chrome(options=chrome_options)

        # ICPSR - wait for metrics to load
        print("="*60)
        print("ICPSR 38567 - Waiting for metrics to load")
        print("="*60)
        try:
            driver.get("https://www.icpsr.umich.edu/web/ICPSR/studies/38567")
            
            # Wait for the display-2 spans to appear (metrics loaded by JS)
            print("Waiting for metrics to load...")
            WebDriverWait(driver, 20).until(
                EC.presence_of_element_located((By.CLASS_NAME, "display-2"))
            )
            print("✅ Metrics loaded!")
            
            # Now get the page source after JS has run
            soup = BeautifulSoup(driver.page_source, 'html.parser')
            
            # Find all figures
            figures = soup.find_all('figure', class_='d-flex')
            print(f"Found {len(figures)} figure elements")
            
            for figure in figures:
                figcaption = figure.find('figcaption')
                number_span = figure.find('span', class_='display-2')
                
                if figcaption and number_span:
                    caption_text = figcaption.text.strip()
                    number = extract_number(number_span.text)
                    print(f"  {caption_text}: {number}")
                    
        except Exception as e:
            print(f"❌ Error: {e}")
            import traceback
            traceback.print_exc()

        # openICPSR - wait for metrics to load
        print("\n" + "="*60)
        print("openICPSR 110641 - Waiting for metrics to load")
        print("="*60)
        try:
            driver.get("https://www.openicpsr.org/openicpsr/project/110641/view")
            
            # Wait for the statNum spans to appear
            print("Waiting for metrics to load...")
            WebDriverWait(driver, 20).until(
                EC.presence_of_element_located((By.CLASS_NAME, "statNum"))
            )
            print("✅ Metrics loaded!")
            
            # Now get the page source after JS has run
            soup = BeautifulSoup(driver.page_source, 'html.parser')
            
            # Find download well
            download_well = soup.find('div', class_='overallDownloadWell')
            if download_well:
                stat_num = download_well.find('span', class_='statNum')
                if stat_num:
                    downloads = extract_number(stat_num.text)
                    print(f"✅ Downloads: {downloads}")
            else:
                # Debug - show what we found
                print("Download well not found. Found these wells:")
                wells = soup.find_all('div', class_=lambda x: x and 'Well' in str(x))
                for well in wells[:3]:
                    print(f"  {well.get('class')}")
                    
        except Exception as e:
            print(f"❌ Error: {e}")
            import traceback
            traceback.print_exc()

        driver.quit()
        print("\n✅ Done!")
        EOF
    
    - name: Run test
      run: python test_wait.py
