name: NaNDA Monthly Scraper

on:
  schedule:
    # Run on the 1st of every month at 9 AM UTC
    - cron: '0 9 1 * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run scraper
      run: |
        python nanda_usage_scraper.py

    - name: Generate delta report
      run: |
        python generate_delta.py

    - name: Build dashboard
      run: |
        python build_dashboard.py

    - name: Commit results
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add data/*.csv data/*.md docs/
        git diff --quiet && git diff --staged --quiet || git commit -m "Update scrape results $(date +'%Y-%m-%d')"
        git pull --rebase origin main
        git push
