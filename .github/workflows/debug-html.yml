name: Debug HTML Structure

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install selenium beautifulsoup4
    
    - name: Install Chrome
      uses: browser-actions/setup-chrome@latest
    
    - name: Install ChromeDriver
      uses: nanasess/setup-chromedriver@v2
    
    - name: Create debug script
      run: |
        cat > debug_html.py << 'EOF'
        from selenium import webdriver
        from selenium.webdriver.chrome.options import Options
        from bs4 import BeautifulSoup
        import time

        chrome_options = Options()
        chrome_options.add_argument('--headless')
        chrome_options.add_argument('--no-sandbox')
        chrome_options.add_argument('--disable-dev-shm-usage')
        chrome_options.add_argument('--disable-gpu')

        driver = webdriver.Chrome(options=chrome_options)

        # ICPSR
        print("ICPSR 38567")
        print("="*60)
        driver.get("https://www.icpsr.umich.edu/web/ICPSR/studies/38567")
        time.sleep(5)
        
        soup = BeautifulSoup(driver.page_source, 'html.parser')
        
        # Look for any span with numbers
        print("\nAll spans with 'display' class:")
        display_spans = soup.find_all('span', class_=lambda x: x and 'display' in x)
        for span in display_spans:
            print(f"  Class: {span.get('class')} | Text: {span.text.strip()}")
        
        print("\nAll figcaption elements:")
        figcaptions = soup.find_all('figcaption')
        for fc in figcaptions:
            print(f"  Class: {fc.get('class')} | Text: {fc.text.strip()}")
        
        # openICPSR
        print("\n\nopenICPSR 110641")
        print("="*60)
        driver.get("https://www.openicpsr.org/openicpsr/project/110641/view")
        time.sleep(10)
        
        soup = BeautifulSoup(driver.page_source, 'html.parser')
        
        print("\nAll spans with 'statNum' class:")
        stat_nums = soup.find_all('span', class_='statNum')
        for span in stat_nums:
            print(f"  Text: {span.text.strip()}")
        
        print("\nAll divs with 'Well' in class name:")
        wells = soup.find_all('div', class_=lambda x: x and 'Well' in str(x))
        for well in wells[:5]:  # Just first 5
            print(f"  Classes: {well.get('class')}")

        driver.quit()
        EOF
    
    - name: Run debug
      run: python debug_html.py
